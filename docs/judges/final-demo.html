<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Demo｜Fellow 學伴</title><link rel="stylesheet" href="assets/guide.css"></head><body><div class="demo-shell"><header class="demo-top"><img src="assets/logo.svg" alt=""><div><strong>Fellow｜Final Demo</strong><p>從學生的一次提問，到教師行動與政府匿名洞察</p></div><a href="index.html">回到評審入口</a></header><main class="demo-main"><aside class="demo-rail"><span class="eyebrow">LIVE PRODUCT</span><h1>完整成果</h1><p>請依序點選五段旅程。右側會直接載入實際產品頁面；需要完整操作空間時可另開新分頁。</p><div class="demo-routes"><button type="button" data-demo-route="../learning-chat.html?topic=newton" data-guide="01-學習問答與互動動畫.html" class="active"><b>01</b><span>學習動畫</span><small>學生提問 → 操作 → 檢核</small></button><button type="button" data-demo-route="../resource-chat.html?category=education" data-guide="02-公共資源推薦.html" ><b>02</b><span>資源推薦</span><small>描述需求 → 條件 → 下一步</small></button><button type="button" data-demo-route="../alerts.html" data-guide="03-主動通知與下一步提醒.html" ><b>03</b><span>主動通知</span><small>原因 → 詳情 → 行動</small></button><button type="button" data-demo-route="../teacher.html" data-guide="04-教師學習洞察與複習計畫.html" ><b>04</b><span>教師洞察</span><small>卡點 → 學生 → 複習</small></button><button type="button" data-demo-route="../government.html" data-guide="05-政府匿名需求洞察.html" ><b>05</b><span>政府洞察</span><small>匿名聚合 → 地區 → 趨勢</small></button></div><div class="demo-controls"><button type="button" data-auto-tour>自動導覽：關閉</button><a data-open-demo href="../learning-chat.html?topic=newton" target="_blank" rel="noopener">另開目前 Demo ↗</a></div></aside><section class="demo-stage"><div class="stage-head"><span>目前段落</span><strong data-stage-title>學習動畫</strong><a data-guide-link href="01-學習問答與互動動畫.html">回到詳細教學</a></div><div class="frame-wrap"><iframe data-demo-frame title="Fellow 實際產品 Demo" src="../learning-chat.html?topic=newton"></iframe><div class="frame-hint">此為評審 Demo 專用畫面，可直接切換角色與功能。</div></div></section></main></div><script>(function finalDemo(){const buttons=[...document.querySelectorAll('[data-demo-route]')];const frame=document.querySelector('[data-demo-frame]');const title=document.querySelector('[data-stage-title]');const open=document.querySelector('[data-open-demo]');const guide=document.querySelector('[data-guide-link]');let index=0,timer=null;function activate(i){index=i;const button=buttons[i];buttons.forEach(x=>x.classList.toggle('active',x===button));frame.src=button.dataset.demoRoute;title.textContent=button.querySelector('span').textContent;open.href=button.dataset.demoRoute;guide.href=button.dataset.guide;}buttons.forEach((button,i)=>button.addEventListener('click',()=>{activate(i);if(timer){clearInterval(timer);timer=null;document.querySelector('[data-auto-tour]').textContent='自動導覽：關閉';}}));document.querySelector('[data-auto-tour]').addEventListener('click',event=>{if(timer){clearInterval(timer);timer=null;event.currentTarget.textContent='自動導覽：關閉';return;}event.currentTarget.textContent='自動導覽：每 12 秒切換';timer=setInterval(()=>activate((index+1)%buttons.length),12000);});})()</script></body></html>
