server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend enforces the bounded body before parsing; stream it upstream.
    client_max_body_size 0;
    client_body_timeout 30s;
    access_log off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Resolve the service again after a backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location ~ ^/(api/v1(?:/|$)|health$|docs(?:/|$)|openapi\.json$|redoc$) {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 55s;
        proxy_read_timeout 55s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1d;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
